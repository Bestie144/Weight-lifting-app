    return `<section class="card pv"><div class="pvhead"><h3>${esc(h.name)}</h3><span class="num">session ${n+1}${n<HIIT.length?` of ${HIIT.length}`:''}</span></div>
      ${strip(pi)}<p class="iline num">${planLine(h)}</p>
      <p class="hint">${fmtDur(h.warm||300)} easy warm-up and 5 min cool-down. ${RPE_TXT[h.rpe]} on the hard parts; easy means light pedalling, not stopping.</p>
      <p class="mnote">${esc(h.note)}${prev?` Last time on this session: level ${fmtKg(prev.cardio.level)}.`:''}</p></section>`;}
  if(t==='cond'){const m=steadyTarget();
    return `<section class="card pv"><div class="pvhead"><h3>In this session</h3><span class="num">${m} min</span></div><p class="hint">${m} minutes at a pace you could hold a conversation at, treadmill or bike. Easy sessions build the aerobic base that makes the hard intervals possible.</p></section>`;}
  const ex=S.tpl[t].ex;
  return `<section class="card pv"><div class="pvhead"><h3>In this session</h3><span class="num">${ex.length} exercises</span></div><ol class="pvl">${ex.map(te=>{const d=EX[te.ex],L=lastEntry(te.ex);
    const sc=d.type==='cardio'?`${te.min} min`:`${te.sets}\u00d7${te.min}\u2013${te.max}${d.type==='time'?'s':''}`;
    const lw=d.type!=='w'?'':L&&L.e.sets[0]&&L.e.sets[0].w!=null?`${fmtKg(L.e.sets[0].w)} kg`:'new';
    return `<li><span class="nm">${esc(d.name)}</span><span class="num sc">${sc}</span><span class="num lw${lw==='new'?' nw':''}">${lw}</span></li>`;}).join('')}</ol>
    ${(()=>{const L=muscleLoad(tplItems(t)); return `<div class="pvmus"><h4>Muscles worked</h4>${muscleLadder(L,{cap:SESSION_CAP})}${capNote(L)}</div>`;})()}</section>`;}
/* ---------- Planned exercise rotation ----------
   Swap accessories every few sessions, keep the rest steady. Systematic variation can build
   every region of a muscle; random session-to-session changes can hold progress back
   (Kassiano et al. 2022, J Strength Cond Res). */
const blockDone=t=>S.sessions.filter(x=>x.tpl===t&&x.end>(S.tpl[t].blockAt||0)).length;
function blockPlan(t){const tp=S.tpl[t]; const taken=new Set(tp.ex.map(e=>e.ex)); const out=[];
  tp.ex.forEach((te,k)=>{const nx=(te.alt||[]).find(id=>!taken.has(id)); if(nx){out.push({k,from:te.ex,to:nx}); taken.add(nx);}}); return out;}
function rotateBlock(t){const tp=S.tpl[t];
  blockPlan(t).forEach(({k,from,to})=>{const te=tp.ex[k],od=EX[from],nd=EX[to];
    const alt=te.alt.filter(id=>id!==to).concat(from);
    tp.ex[k]=nd.type===od.type?Object.assign({},te,{ex:to,alt}):Object.assign(defaultsFor(to),{sets:te.sets,alt});});
  tp.blockAt=Date.now();}
function altSheet(t,k){const te=S.tpl[t].ex[k],d=EX[te.ex]; const used=new Set(S.tpl[t].ex.map(e=>e.ex));
  const pool=Object.keys(EX).filter(id=>id!==te.ex&&EX[id].g===d.g&&(te.alt.includes(id)||!used.has(id)));
  openSheet(`<h3>Rotate ${esc(d.name)}</h3><p class="hint">Picked exercises take turns in this slot, one block at a time. Choose ones that work the muscle from a different angle, not near-copies.</p>`+
    (pool.length?pool.map(id=>`<label class="chk"><input type="checkbox" name="alt" value="${id}"${te.alt.includes(id)?' checked':''}><span>${esc(EX[id].name)}<small>${worksText(id)}</small></span></label>`).join('')
      :'<p>No other exercises in the library fit this slot.</p>')+
    `<div class="row"><button class="btn ghost" data-a="close">Cancel</button><button class="btn primary" data-a="saveAlt" data-t="${t}" data-k="${k}">Save</button></div>`);}

/* ---------- Today ---------- */
function viewToday(){const t=S.queue[0]; const after=S.queue.slice(1);
  const ws=weekStart(Date.now()); const wk=S.sessions.filter(s=>s.end>=ws).length+S.extras.filter(x=>x.date>=ws).length;
  const last=lastSession(); const gap=gapDays();
  const strengthSince=S.sessions.filter(s=>!isCardio(s.tpl)&&s.end>(S.deloadAck||0)).length;
  let banners='';
  if(S.sessions.length-(S.backupAt||0)>=10) banners+=`<div class="banner" style="--c:var(--push)"><p><b>Time for a backup.</b> ${S.sessions.length-(S.backupAt||0)} sessions since your last one. Data on this phone can be lost if Safari data is cleared or the phone is replaced.</p>
    <div class="row"><button class="btn primary" data-a="backupFile">Save backup file</button><button class="btn ghost" data-a="backupLater">Later</button></div></div>`;
  if(last&&gap>7) banners+=`<div class="banner" style="--c:var(--pull)"><p><b>It\u2019s been ${gap} days.</b> Easing back in lowers the risk of a sore week.</p>
    <label><input type="checkbox" id="retChk" ${ui.ret?'checked':''}> Use about 80% of my usual weights next session</label></div>`;
  if(S.lightLeft>0) banners+=`<div class="banner" style="--c:var(--cond)"><p><b>Lighter week.</b> One set fewer per exercise for the next ${S.lightLeft} strength session${S.lightLeft>1?'s':''}.</p></div>`;
  else if(strengthSince>=18) banners+=`<div class="banner" style="--c:var(--cond)"><p><b>Six full rotations done.</b> A lighter week now helps you keep progressing: same weights, one set fewer per exercise.</p>
    <div class="row"><button class="btn primary" data-a="deloadYes">Start a lighter week</button><button class="btn ghost" data-a="deloadNo">Not now</button></div></div>`;
  if(!isCardio(t)&&S.settings.block>0){const plan=blockPlan(t), done=blockDone(t);
    if(plan.length&&done>=S.settings.block) banners+=`<div class="banner" style="--c:var(--accent)"><p><b>New block for ${tname(t)}.</b> ${done} sessions on these exercises. Changing the accessories now keeps progress coming; your main lifts stay the same.</p>
      <ul class="swaplist">${plan.map(p=>`<li><span>${esc(EX[p.from].name)}</span><span class="ar" aria-hidden="true"></span><span class="sr">changes to</span><span class="to">${esc(EX[p.to].name)}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn primary" data-a="rotate" data-t="${t}">Change exercises</button><button class="btn ghost" data-a="keepBlock" data-t="${t}">Not yet</button></div></div>`;}
  return `
  ${weekStrip()}
  <section class="hero hasfig${tname(t).length>7?' lng':''}" style="${col(t)}">${ring()}<div class="hfig" aria-hidden="true">${figure(heroSpec(t))}</div>
    <p class="k">Next up</p><h1${tname(t).length>7?' class="long"':''}>${tname(t)}</h1><p class="sub">${estText(t)}</p>
    <button class="btn go" data-a="start">Start ${tname(t)}</button>
  </section>
  <div class="after"><span>Then</span>${after.map(x=>`<span class="chip"><span class="dot" style="${col(x)}"></span>${tname(x)}</span>`).join('')}</div>
  ${banners}
  ${preview(t)}
  <div class="row" style="margin-bottom:12px">
    <button class="btn ghost" data-a="pick">Choose another</button>
    <button class="btn ghost" data-a="skip">Move to back</button>
  </div>
  <div class="row"><button class="btn ghost" data-a="extra">Log extra cardio</button><button class="btn ghost" data-a="logBody">Log bodyweight</button></div>
  <p class="hint" style="margin-top:8px">Extra cardio is logged separately and doesn\u2019t move the rotation on.</p>`;}

/* ---------- Summary ---------- */
function viewSummary(){const idx=S.sessions.findIndex(s=>s.id===ui.summary); const s=S.sessions[idx];
  if(!s){ui.summary=null;return viewToday();}
  const dur=Math.max(1,Math.round((s.end-s.start)/60000)); let body='';
  if(isCardio(s.tpl)){const c=s.cardio; const prev=S.sessions.slice(0,idx).reverse().find(x=>x.tpl===s.tpl&&x.cardio.variant===c.variant&&x.cardio.machine===c.machine&&(s.tpl!=='hiit'||x.cardio.plan===c.plan));
    let cmp=''; if(s.tpl==='hiit'&&prev&&c.level&&prev.cardio.level){const dl=c.level-prev.cardio.level; cmp=`<p style="margin-top:8px">${dl>0?`<b class="plus">+${fmtKg(dl)} levels</b> on last time`:`Last time: level ${fmtKg(prev.cardio.level)}`}</p>`;}
    else if(prev&&c.km&&prev.cardio.km){const dkm=c.km-prev.cardio.km; cmp=`<p style="margin-top:8px">${dkm>0?`<b class="plus">+${fmtKg(dkm)} km</b> on last time`:`Last time: ${fmtKg(prev.cardio.km)} km`}</p>`;}
    const what=s.tpl==='hiit'&&c.plan!=null?`${HIIT[c.plan].name} on the bike`:`${c.variant==='intervals'?'Intervals':'Steady'} on the ${c.machine}`;
    const wk=cardioWeek(weekStart(Date.now()));
    body=`<section class="card"><p>${what}: <b>${fmtKg(c.mins)} min</b>${c.level?`, level <b>${fmtKg(c.level)}</b>`:''}${c.km?`, <b>${fmtKg(c.km)} km</b>`:''}</p>${cmp}
      <p class="hint" style="margin-top:8px">${wk} of ${CARDIO_GOAL} cardio minutes this week.</p></section>`;}
  else {const prs=[],imp=[];
    s.entries.forEach(e=>{const d=EX[e.ex]; if(!d) return; const prior=S.sessions.slice(0,idx);
      const pe=lastEntry(e.ex,idx); const nb=bestOf(e.ex,e.sets);
      let pb=null; prior.forEach(p=>(p.entries||[]).forEach(x=>{if(x.ex===e.ex){const b=bestOf(e.ex,x.sets); if(b&&(!pb||b.v>pb.v)) pb=b;}}));
      if(pb&&nb&&nb.v>pb.v+0.01&&d.type!=='cardio') prs.push(`<li><span>${esc(d.name)}</span><b>${d.type==='w'?`${fmtKg(nb.w)} kg \u00d7 ${nb.r}`:`${nb.r} ${unitShort(d)}`}</b></li>`);
      if(pe&&d.type!=='cardio'){const tw=x=>Math.max(...x.map(s=>s.w||0)), tr=x=>x.reduce((a,s)=>a+(s.r||0),0);
        if(d.type==='w'&&tw(e.sets)>tw(pe.e.sets)) imp.push(`<li><span>${esc(d.name)}</span><b class="plus">+${fmtKg(tw(e.sets)-tw(pe.e.sets))} kg</b></li>`);
        else if((d.type!=='w'||tw(e.sets)===tw(pe.e.sets))&&tr(e.sets)>tr(pe.e.sets)) imp.push(`<li><span>${esc(d.name)}</span><b class="plus">+${tr(e.sets)-tr(pe.e.sets)} ${d.type==='time'?'sec':'reps'}</b></li>`);}});
    const sets=s.entries.reduce((a,e)=>a+e.sets.length,0);
    body=`${prs.length?`<section class="card"><h3 class="shine">New personal bests</h3><ul class="sumlist">${prs.join('')}</ul></section>`:''}
      <section class="card"><h3>Better than last time</h3>${imp.length?`<ul class="sumlist">${imp.join('')}</ul>`:'<p class="hint" style="margin-top:6px">Matched last time. Holding steady still counts.</p>'}</section>`;
    s._sets=sets;}
  return `<section class="hero" style="${col(s.tpl)}">${PLATE}<p class="k">Session saved</p><h1${tname(s.tpl).length>7?' class="long"':''}>${tname(s.tpl)}</h1>
    <p class="sub">${dur} min${isCardio(s.tpl)?'':`, ${s._sets} sets`}</p><button class="btn go" data-a="sumDone">Done</button></section>
    ${body}<p class="hint" style="margin:4px 2px">Next up: <b>${tname(S.queue[0])}</b></p>`;}

/* ---------- Workout ---------- */
function viewWorkout(){const c=S.current,t=c.tpl;
  let notes='';
  if(c.ret) notes+=`<div class="banner" style="--c:var(--pull)"><p>Return session: weights are set to about 80% of last time.</p></div>`;
  if(c.light) notes+=`<div class="banner" style="--c:var(--cond)"><p>Lighter week: one set fewer per exercise.</p></div>`;
  let tot=0,dn=0; c.entries.forEach(en=>en.sets.forEach(s=>{tot++; if(s.done) dn++;}));
  const prog=isCardio(t)?'':`<div class="wprog" role="progressbar" aria-label="Sets done" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${dn}"><i style="width:${tot?100*dn/tot:0}%"></i></div><p class="wsets num">${dn} of ${tot} sets</p>`;
  const head=`<section class="whead" style="${col(t)}"><div class="wtop"><div><p class="k">In progress</p><h1${tname(t).length>7?' class="long"':''}>${tname(t)}</h1></div><div class="el num" data-elapsed>0:00</div></div>${prog}</section>
    <div class="row" style="margin-bottom:12px"><button class="btn ghost" data-a="discard">Discard</button><button class="btn primary" data-a="finish">Finish session</button></div>`;
  if(isCardio(t)) return head+notes+viewCond(c.cardio,t);
  const cs=curSet(); const firstHeavy=c.entries.findIndex(en=>EX[en.ex].type==='w'&&!EX[en.ex].iso);
  return head+notes+c.entries.map((en,i)=>exCard(en,i,cs,i===firstHeavy,c.entries.length)).join('');}

function exCard(en,i,cs,warm,n){const d=EX[en.ex]; const done=en.sets.every(s=>s.done); const how=ui.openHow.has(i); const inc=S.settings.inc;
  const wt=d.type==='w'?`<div class="wt"><button data-a="wstep" data-i="${i}" data-d="-1" aria-label="Lighter">\u2212</button>
     <div class="val"><strong class="num" data-ew="${i}">${fmtKg(en.w)}</strong><span>${loadLabel(d)}</span></div>
     <button data-a="wstep" data-i="${i}" data-d="1" aria-label="Heavier">+</button></div>`:'';
  let wu='';
  if(warm&&en.w&&en.w>=inc*3&&!en.sets.some(s=>s.done)){const w1=roundTo(en.w*0.5,inc),w2=roundTo(en.w*0.75,inc);
    wu=`<div class="warm"><span>Warm-up, not logged:</span>
      <button data-a="warm" data-k="${i}-1" aria-pressed="${ui.warm.has(i+'-1')}">8 \u00d7 ${fmtKg(w1)} kg</button>
      <button data-a="warm" data-k="${i}-2" aria-pressed="${ui.warm.has(i+'-2')}">5 \u00d7 ${fmtKg(w2)} kg</button></div>`;}
  const rows=en.sets.map((s,j)=>{const cur=cs&&cs.i===i&&cs.j===j;
    const w=d.type==='w'?`<label class="cell"><input inputmode="decimal" data-f="w" data-i="${i}" data-j="${j}" value="${s.w??''}" placeholder="kg" aria-label="Set ${j+1} weight"><span>kg</span></label>`:'';
    return `<div class="set${d.type==='w'?'':' bw'}${s.done?' done':''}${cur?' current':''}"><span class="n">${j+1}</span>${w}
      <label class="cell"><input inputmode="numeric" data-f="r" data-i="${i}" data-j="${j}" value="${s.r??''}" placeholder="${d.type==='cardio'?en.min:en.min+'\u2013'+en.max}" aria-label="Set ${j+1} ${unitWord(d)}"><span>${unitShort(d)}</span></label>
      <button class="tick" data-a="tick" data-i="${i}" data-j="${j}" aria-label="Set ${j+1} done" aria-pressed="${s.done}">\u2713</button></div>`;}).join('');
  const note=S.notes[en.ex];
  const eff=done&&d.type!=='cardio'?`<div class="effort"><p>How did that feel?</p><div class="seg" role="group" aria-label="Effort">
      ${['easy','good','hard'].map(v=>`<button data-a="effort" data-i="${i}" data-v="${v}" aria-pressed="${en.effort===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></div>`:'';
  const dc=en.sets.filter(s=>s.done).length;
  const meta=`<div class="exmeta"><span class="exn num">${pad(i+1)}<span>/${pad(n)}</span></span><span class="pips" aria-hidden="true">${en.sets.map((s,j)=>`<i class="${s.done?'on':cs&&cs.i===i&&cs.j===j?'cur':''}"></i>`).join('')}</span><span class="sr">${dc} of ${en.sets.length} sets done</span></div>`;
  return `<article class="ex${done?' complete':''}">${meta}
    <header><div><h3>${esc(d.name)}</h3>${MUS[en.ex]?`<p class="works">${worksText(en.ex)}</p>`:''}</div><button class="link" data-a="how" data-i="${i}" aria-expanded="${how}">${how?'Hide':'How to'}</button></header>
    ${how?`${EXF[en.ex]?`<div class="demobox" style="${col(S.current.tpl)}"><div class="hfig demo" role="img" aria-label="Animated demonstration of ${esc(d.name)}">${figure(EXF[en.ex])}</div></div>`:''}<ul class="cues">${d.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
    ${note?`<div class="note"><p>${esc(note)}</p><button class="link" data-a="note" data-i="${i}">Edit</button></div>`:''}
    <p class="last">${en.lastText?`Last time: ${esc(en.lastText)}`:'No history yet'}</p>
    <p class="aim">${en.up?`<span class="up">Up from ${fmtKg(en.prevW)} kg</span>`:''}${esc(en.aim)}</p>
    ${wt}${wu}<div class="sets">${rows}</div>${eff}
    <div class="exlinks">${d.type==='cardio'?'':`<button class="link" data-a="addSet" data-i="${i}">Add set</button>${en.sets.length>1?`<button class="link" data-a="delSet" data-i="${i}">Remove set</button>`:''}`}
      ${note?'':`<button class="link" data-a="note" data-i="${i}">Add note</button>`}<button class="link" data-a="swap" data-i="${i}">Swap</button></div>
  </article>`;}

function renderDock(){const dock=$('#dock'); const c=S.current;
  const show=!!c&&!isCardio(c.tpl)&&ui.tab==='today'&&!ui.summary;
  dock.hidden=!show; document.body.classList.toggle('docked',show); if(!show) return;
  const cs=curSet(); let l2='Finish to save the session.';
  if(cs){const en=c.entries[cs.i],d=EX[en.ex],s=en.sets[cs.j];
    const what=d.type==='w'?`${fmtKg(s.w)} kg \u00d7 ${s.r??'?'}`:`${s.r??'?'} ${unitShort(d)}`;
    l2=`${d.name}, set ${cs.j+1} of ${en.sets.length}: ${what}`;}
  const l1=ui.rest?`<span>Rest</span><b class="num shine" id="dRest">${fmtClock(ui.rest.end-Date.now()+999)}</b><span style="display:flex;gap:6px"><button data-a="restAdd">+15s</button><button data-a="restSkip">Skip</button></span>`:(cs?'Up next':'All sets done');
  dock.innerHTML=`<div class="dinfo"><div class="dl1">${l1}</div><div class="dl2">${esc(l2)}</div></div>
    <button class="btn dgo" data-a="${cs?'dockTick':'finish'}">${cs?'Done set':'Finish'}</button>${ui.rest?`<i id="dBar" style="width:${100*(ui.rest.end-Date.now())/ui.rest.total}%"></i>`:''}`;}

function condElapsed(cd){return cd.acc+(cd.runAt?Date.now()-cd.runAt:0);}
function viewCond(cd,t){const iv=t==='hiit'; const running=!!cd.runAt;
  const h=iv?HIIT[cd.plan]:null;
  const top=iv?`<div class="pvhead"><h3>${esc(h.name)}</h3><span class="num">${planLine(h)}</span></div>${strip(cd.plan)}
      <p style="margin-top:12px">${RPE_TXT[h.rpe]} on the hard parts. ${esc(h.note)}</p>`
    :`<div class="seg" role="group" aria-label="Machine">
      <button data-a="cmach" data-v="treadmill" aria-pressed="${cd.machine==='treadmill'}">Treadmill</button><button data-a="cmach" data-v="bike" aria-pressed="${cd.machine==='bike'}">Bike</button></div>
      <p>${cd.target||30} minutes at a pace you could hold a conversation at.</p>`;
  return `<section class="card">${top}
    <div class="ctimer" id="ctimer"><div class="ph" id="cPh">${iv?'Warm-up':'Steady'}</div><div class="big num" id="cT">0:00</div><div class="hint" id="cSub">&nbsp;</div></div>
    <div class="row"><button class="btn primary" data-a="cgo">${running?'Pause':(cd.acc?'Resume':'Start timer')}</button><button class="btn ghost" data-a="creset">Reset</button></div>
  </section>
  <section class="card">
    <label class="field"><span>Minutes</span><input id="cMins" inputmode="decimal" data-cf="mins" value="${esc(cd.mins)}" placeholder="Filled from the timer if left blank"></label>
    ${iv?`<label class="field"><span>Resistance level on the hard parts (optional)</span><input inputmode="decimal" data-cf="level" value="${esc(cd.level)}" placeholder="Raise it when the hard parts feel easier"></label>`
      :`<label class="field"><span>Distance (km, optional)</span><input inputmode="decimal" data-cf="km" value="${esc(cd.km)}"></label>`}
    <label class="field"><span>Notes (optional)</span><textarea data-cf="notes">${esc(cd.notes)}</textarea></label>
  </section>
  <button class="btn primary" style="width:100%" data-a="finish">Finish session</button>`;}

/* ---------- History ---------- */
function viewHistory(){
  const seg=`<div class="seg" role="group" aria-label="History view">${[['sessions','Sessions'],['progress','Progress'],['body','Body']].map(([k,l])=>`<button data-a="hv" data-v="${k}" aria-pressed="${ui.hv===k}">${l}</button>`).join('')}</div>`;
  const inner=ui.hv==='progress'?viewProgress():ui.hv==='body'?viewBody():viewSessions();
  return `<h2 class="page">History</h2>${seg}${inner}`;}

function calendar(){const base=new Date();base.setDate(1);base.setHours(0,0,0,0);base.setMonth(base.getMonth()+ui.calOff);
  const y=base.getFullYear(),m=base.getMonth(); const days=new Date(y,m+1,0).getDate(); const lead=(base.getDay()+6)%7;
  const byDay={}; const add=(t,c)=>{const k=dayStart(t);(byDay[k]=byDay[k]||[]).push(c);};
  S.sessions.forEach(s=>add(s.end,`var(--${s.tpl})`)); S.extras.forEach(x=>add(x.date,'var(--muted)'));
  let n=0; Object.keys(byDay).forEach(k=>{const d=new Date(+k); if(d.getFullYear()===y&&d.getMonth()===m) n++;});
  let cells=['M','T','W','T','F','S','S'].map(h=>`<div class="h">${h}</div>`).join('');
  for(let k=0;k<lead;k++) cells+='<div class="d out"></div>';
  const today=dayStart(Date.now());
  for(let dd=1;dd<=days;dd++){const t=new Date(y,m,dd).getTime(); const cs=byDay[t]||[];
    cells+=`<div class="d${t===today?' today':''}"><span>${dd}</span>${cs.length?`<span class="ds">${cs.slice(0,3).map(c=>`<span style="--c:${c}"></span>`).join('')}</span>`:''}</div>`;}
  return `<section class="card"><div class="calhead"><button data-a="cal" data-d="-1" aria-label="Previous month">\u2039</button>
    <div style="text-align:center"><h3>${base.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><span class="hint">${n} training day${n===1?'':'s'}</span></div>
    <button data-a="cal" data-d="1" aria-label="Next month"${ui.calOff>=0?' disabled style="opacity:.3"':''}>\u203a</button></div><div class="cal">${cells}</div></section>`;}

function viewSessions(){
  const items=[...S.sessions.map(s=>({k:'s',t:s.end,s})),...S.extras.map(x=>({k:'x',t:x.date,x}))].sort((a,b)=>b.t-a.t);
  let html=calendar();
  if(!items.length) return html+`<p class="empty">Finished sessions appear here, grouped by week. Start one from Today.</p>`;
  let curW=null;
  items.forEach(it=>{const w=weekStart(it.t);
    if(w!==curW){curW=w; const n=items.filter(x=>weekStart(x.t)===w).length;
      html+=`<div class="week"><h3>Week of ${fmtShort(w)}</h3><span>${n} session${n===1?'':'s'}</span></div>`;}
    html+=it.k==='s'?sessRow(it.s):extraRow(it.x);});
  return html;}

function sessRow(s){const dur=Math.max(1,Math.round((s.end-s.start)/60000)); let sum,body;
  if(isCardio(s.tpl)){const c=s.cardio; sum=`${s.tpl==='hiit'&&c.plan!=null?HIIT[c.plan].name:c.variant==='intervals'?'Intervals':'Steady'} on the ${c.machine}, ${fmtKg(c.mins)} min${c.level?`, level ${fmtKg(c.level)}`:''}${c.km?`, ${fmtKg(c.km)} km`:''}`;
    body=c.notes?`<p>${esc(c.notes)}</p>`:'';}
  else {const sets=s.entries.reduce((a,e)=>a+e.sets.length,0); sum=`${s.entries.length} exercises, ${sets} sets, ${dur} min`;
    body=s.entries.map(e=>`<p><b>${esc(EX[e.ex]?EX[e.ex].name:e.ex)}</b>: ${esc(fmtSets(e.ex,e.sets))}${e.effort?`, ${EFF[e.effort]}`:''}</p>`).join('');}
  return `<details class="sess"><summary><span class="dot" style="${col(s.tpl)}"></span><span class="t"><b>${esc(tname(s.tpl))}</b><small>${fmtDay(s.end)}. ${esc(sum)}</small></span></summary>
    <div class="body">${body}<div class="exlinks"><button class="link" data-a="edit" data-id="${s.id}">Edit</button><button class="link" data-a="delS" data-id="${s.id}">Delete</button></div></div></details>`;}
function extraRow(x){return `<details class="sess"><summary><span class="dot" style="--c:var(--muted)"></span><span class="t"><b>Extra cardio</b><small>${fmtDay(x.date)}. ${x.machine==='bike'?'Bike':'Treadmill'}, ${fmtKg(x.mins)} min${x.km?`, ${fmtKg(x.km)} km`:''}</small></span></summary>
    <div class="body"><button class="link" data-a="delX" data-id="${x.id}">Delete entry</button></div></details>`;}

function viewProgress(){
  const exIds=[...new Set(S.sessions.flatMap(s=>(s.entries||[]).map(e=>e.ex)))].filter(id=>EX[id]&&EX[id].type!=='cardio');
  if(!exIds.length) return `<p class="empty">Progress charts appear once you\u2019ve logged a strength session.</p>`+balance();
  if(!exIds.includes(ui.prog)) ui.prog=exIds[0];
  const d=EX[ui.prog]; let best=null;
  const pts=S.sessions.filter(s=>(s.entries||[]).some(e=>e.ex===ui.prog)).map(s=>{const e=s.entries.find(e=>e.ex===ui.prog); const b=bestOf(ui.prog,e.sets);
    if(!best||b.v>best.v) best=Object.assign({t:s.end},b); return {t:s.end,v:b.v};}).slice(-20);
  const unit=d.type==='w'?'kg':d.type==='time'?'sec':'reps';
  const bestTxt=d.type==='w'?`${fmtKg(best.w)} kg \u00d7 ${best.r} (estimated max ${fmt1(best.v)} kg)`:`${best.r} ${unit}`;
  return `<section class="card"><label class="field" style="margin:0"><span>Exercise</span><select id="progSel">${exIds.map(id=>`<option value="${id}"${id===ui.prog?' selected':''}>${esc(EX[id].name)}</option>`).join('')}</select></label>
    ${chart(pts,unit)}<p class="hint" style="margin-top:6px">${d.type==='w'?'Estimated 1-rep max from your best set each session, so more reps at the same weight count as progress.':'Best set each session.'}</p>
    <p style="margin-top:10px"><b>Personal best:</b> ${bestTxt}, ${fmtShort(best.t)}</p></section>`+balance();}

function balance(){const now=Date.now(); const from=ui.balRange==='week'?weekStart(now):weekStart(now)-21*864e5; const weeks=ui.balRange==='week'?1:4;
  const items=[]; S.sessions.filter(s=>s.end>=from).forEach(s=>(s.entries||[]).forEach(e=>items.push({ex:e.ex,n:e.sets.length})));
  const L=muscleLoad(items); if(weeks>1) MUSCLE_ORDER.forEach(k=>{L[k].d/=weeks;L[k].h/=weeks;L[k].v/=weeks;});
  const low=weeks>1&&items.length?MUSCLE_ORDER.filter(k=>L[k].v<WEEK_BAND[0]).map(k=>MUSCLE[k]):[];
  return `<section class="card"><h3>Sets per muscle</h3><p class="hint" style="margin:4px 0 10px">${weeks>1?'Weekly average. ':''}Gains keep rising with more weekly sets, but each extra set adds less. ${WEEK_BAND[0]}\u2013${WEEK_BAND[1]} a week is a common target.</p>
    <div class="seg" role="group" aria-label="Range"><button data-a="bal" data-v="week" aria-pressed="${ui.balRange==='week'}">This week</button><button data-a="bal" data-v="4w" aria-pressed="${ui.balRange==='4w'}">Last 4 weeks</button></div>
    ${muscleLadder(L,{all:true,band:WEEK_BAND})}
    ${low.length?`<p class="mnote"><b>Under ${WEEK_BAND[0]} a week:</b> ${esc(listJoin(low))}. Add a set to those exercises or train more often.</p>`:''}</section>`;}

/* Rate of loss: 0.5-1% of bodyweight a week keeps more muscle than faster loss (Garthe et al. 2011).
   Trend = least-squares slope over the last 28 days, so single noisy weigh-ins don't swing it. */
function trend(arr){const w=arr.filter(x=>x.date>=Date.now()-28*864e5); if(w.length<4||w[w.length-1].date-w[0].date<10*864e5) return null;
  const xs=w.map(x=>(x.date-w[0].date)/864e5), ys=w.map(x=>x.kg), n=w.length, mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  const sl=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  return {kgWk:sl*7, pct:-sl*7/my*100, now:my+sl*(xs[n-1]-mx)};}
function rateCard(arr){const g=S.settings.goalKg, tr=trend(arr), last=arr[arr.length-1];
  const prot=`<p class="mnote">Protein: about <b>${Math.round(last.kg*1.6/5)*5}\u2013${Math.round(last.kg*2/5)*5} g a day</b> (1.6\u20132 g per kg) helps keep muscle while losing fat.</p>`;
  let rate='';
  if(tr){const p=tr.pct, loss=Math.abs(tr.kgWk), dv=S.settings.bwUnit==='st'?`${fmt1(kgToLb(loss))} lb`:`${fmt1(loss)} kg`;
    const st=p<0?['up','Gaining weight','If fat loss is the aim, trim portions a little.']:p<0.5?['slow','Slower than the target','Fine if your lifts are going up. If not, trim about 200 kcal a day.']:p<=1?['ok','On target','Keep doing what you\u2019re doing.']:['fast','Faster than the target','Faster than 1% a week risks losing muscle. Eat a little more.'];
    const eta=g&&p>0&&tr.now>g?Math.ceil((tr.now-g)/loss):null;
    rate=`<div class="rate ${st[0]}"><p><b>${st[1]}.</b> ${p<0?'Up':'Down'} ${dv} a week (${fmt1(Math.abs(p))}%). ${st[2]}</p>
      <div class="rtr" aria-hidden="true"><span class="band"></span><span class="pin" style="left:${Math.max(0,Math.min(100,(p+0.5)/2*100))}%"></span></div>
      <p class="rl"><span>Gaining</span><span>0.5\u20131% a week</span><span>Too fast</span></p>
      ${eta?`<p class="hint" style="margin-top:6px">About ${eta} week${eta>1?'s':''} to your goal of ${fmtBW(g)} at this rate.</p>`:''}</div>`;}
  else rate=`<p class="mnote">Log your weight 3\u20134 times a week. After 10 days the app shows your rate of loss against the 0.5\u20131% a week target.</p>`;
  const goal=`<div class="goalrow"><span>${g?`Goal: <b>${fmtBW(g)}</b>`:'No goal weight set'}</span><button class="link" data-a="goal">${g?'Change':'Set goal'}</button></div>`;
  return goal+rate+prot;}
function goalSheet(){const st=S.settings.bwUnit==='st', g=S.settings.goalKg; let f;
  if(st){const lb=g?Math.round(kgToLb(g)):null; f=`<div class="two"><label class="field"><span>Stone</span><input id="gSt" inputmode="numeric" value="${lb?Math.floor(lb/14):''}"></label><label class="field"><span>Pounds</span><input id="gLb" inputmode="decimal" value="${lb?lb%14:''}"></label></div>`;}
  else f=`<label class="field"><span>Goal weight (kg)</span><input id="gKg" inputmode="decimal" value="${g?fmt1(g):''}"></label>`;
  openSheet(`<h3>Goal weight</h3>${f}<div class="row"><button class="btn ghost" data-a="${g?'clearGoal':'close'}">${g?'Remove goal':'Cancel'}</button><button class="btn primary" data-a="saveGoal">Save goal</button></div>`);}
function viewBody(){const u=S.settings.bwUnit; const arr=S.body.slice().sort((a,b)=>a.date-b.date);
  const unitSeg=`<div class="seg" role="group" aria-label="Units"><button data-a="bwUnit" data-v="kg" aria-pressed="${u==='kg'}">kg</button><button data-a="bwUnit" data-v="st" aria-pressed="${u==='st'}">stone</button></div>`;
  if(!arr.length) return `<section class="card">${unitSeg}<p class="hint" style="margin:6px 0 12px">Optional. Weigh in at the same time of day, e.g. first thing in the morning, for a fair trend.</p>
    <button class="btn primary" style="width:100%" data-a="logBody">Log bodyweight</button></section>`;
  const last=arr[arr.length-1]; const m30=arr.filter(x=>x.date>=Date.now()-30*864e5);
  let change=''; if(m30.length>1){const dk=last.kg-m30[0].kg; const dv=u==='st'?`${fmt1(Math.abs(kgToLb(dk)))} lb`:`${fmt1(Math.abs(dk))} kg`;
    change=`<p class="hint">${Math.abs(dk)<0.05?'No change':`${dk>0?'Up':'Down'} ${dv}`} over the last 30 days</p>`;}
  const pts=arr.slice(-30).map(x=>({t:x.date,v:bwVal(x.kg)}));
  return `<section class="card">${unitSeg}<p class="big2 num" style="margin-top:6px">${fmtBW(last.kg)}</p><p class="hint">${fmtDay(last.date)}</p>${change}${rateCard(arr)}
    ${pts.length>1?chart(pts,u==='st'?'st':'kg'):''}
    <button class="btn primary" style="width:100%;margin-top:12px" data-a="logBody">Log bodyweight</button></section>
    <section class="card"><h3>Recent</h3><ul class="sumlist">${arr.slice(-8).reverse().map(x=>`<li><span>${fmtDay(x.date)}: <b>${fmtBW(x.kg)}</b></span><button class="link" data-a="delBody" data-id="${x.id}">Delete</button></li>`).join('')}</ul></section>`;}

function chart(pts,unit){const W=320,H=150,L=38,R=10,T=14,B=24;
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs); const rlo=lo,rhi=hi; if(lo===hi){lo-=1;hi+=1;}
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1); const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart from ${fmt1(rlo)} to ${fmt1(rhi)} ${unit}">
    <line class="ax" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    <text x="${L-6}" y="${y(rhi)+4}" text-anchor="end">${fmt1(rhi)}</text>${rhi!==rlo?`<text x="${L-6}" y="${y(rlo)+4}" text-anchor="end">${fmt1(rlo)}</text>`:''}
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E6AD2" stop-opacity=".35"/><stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/></linearGradient></defs>
    <path class="ar" d="${d}L${x(pts.length-1).toFixed(1)},${H-B}L${x(0).toFixed(1)},${H-B}Z"/><path class="ln" d="${d}"/>${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('')}
    <text x="${L}" y="${H-6}">${fmtShort(pts[0].t)}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].t)}</text>`:''}</svg>`;}

  const tplHtml=['push','legs','pull'].map(t=>{const tp=S.tpl[t]; const used=new Set(tp.ex.map(e=>e.ex));

          <input inputmode="numeric" data-tf="max" data-t="${t}" data-k="${k}" value="${te.max}" aria-label="Maximum"> ${unitShort(d)}`;
      return `<div class="trow"><div class="nm"><span>${esc(d.name)}</span><span class="row" style="gap:4px">

        ${MUS[te.ex]?`<p class="works">${worksText(te.ex)}</p>`:''}
        <div class="ctl">${ctl}</div>
        ${d.type==='cardio'?'':`<div class="rot"><span>${te.alt.length?`Rotates with ${esc(listJoin(te.alt.map(id=>EX[id].name)))}`:'Stays the same every block'}</span><button class="link" data-a="altEdit" data-t="${t}" data-k="${k}">${te.alt.length?'Edit':'Rotate'}</button></div>`}</div>`;}).join('');
    const opts=Object.keys(EX).filter(id=>!used.has(id)).map(id=>`<option value="${id}">${esc(EX[id].name)}</option>`).join('');
    const L=muscleLoad(tplItems(t)); const nb=S.settings.block>0&&blockPlan(t).length?`<p class="mnote">Block ${Math.min(blockDone(t),S.settings.block)} of ${S.settings.block} sessions. <button class="link" data-a="rotate" data-t="${t}" style="min-height:0">Change exercises now</button></p>`:'';
    return `<details class="tpl" data-tpl="${t}"${ui.openTpl===t?' open':''}><summary><span class="dot" style="${col(t)}"></span>${tp.name}<small>${tp.ex.length} exercises</small></summary>
      <div class="tmus"><h4>Muscles worked</h4>${muscleLadder(L,{cap:SESSION_CAP})}${capNote(L)}${nb}</div>
      ${rows}<div class="addrow"><select id="add-${t}" aria-label="Exercise to add">${opts}</select><button class="btn ghost" data-a="addEx" data-t="${t}">Add</button></div></details>`;}).join('');
  return `<h2 class="page">Setup</h2>
  <section class="card"><h3>Rotation order</h3><p class="hint">Sessions run in this order. Whatever you finish goes to the back.</p>
    <ol class="q">${S.queue.map((t,i)=>`<li><div><span class="dot" style="${col(t)}"></span>${tname(t)}${i===0?'<em>next</em>':`<button class="link" data-a="makeNext" data-t="${t}">Make next</button>`}</div></li>`).join('')}</ol></section>
  <h3 style="margin:20px 0 10px">Sessions</h3>${tplHtml}
  <p class="hint" style="margin:4px 2px 12px">Bike HIIT follows a 12-session plan that builds from 6 one-minute efforts to 4 \u00d7 4 minutes, then keeps cycling the last four sessions. Steady cardio builds from 30 to 40 minutes.</p>
  <section class="card"><label class="field" style="margin:0"><span>Change exercises every</span>
    <select id="blockSel">${[[4,'4 sessions of each type'],[6,'6 sessions of each type'],[8,'8 sessions of each type'],[0,'Never, keep them fixed']].map(([v,l])=>`<option value="${v}"${v===S.settings.block?' selected':''}>${l}</option>`).join('')}</select></label>
    <p class="hint" style="margin-top:6px">Only exercises with rotation picks change. Planned changes help grow every part of a muscle and keep training fresh; changing every session can hold progress back.</p></section>
  <button class="link" data-a="resetTpl">Restore the default sessions</button>
  <section class="card" style="margin-top:16px"><label class="field" style="margin:0"><span>Weight step</span>
    <select id="incSel">${incs.map(v=>`<option value="${v}"${v===S.settings.inc?' selected':''}>${v} kg</option>`).join('')}</select></label>
    <p class="hint" style="margin-top:6px">How much the app adds when you go heavier. Match the smallest jump your dumbbells allow.</p></section>
  <section class="card"><h3>Backup</h3><p class="hint" style="margin:6px 0 12px">Your data is stored on this device only. Save a backup file now and then to Files, OneDrive or email, so you can restore it on a new phone or after clearing Safari data.${S.backupAt?'':' No backup saved yet.'}</p>
    <div class="row"><button class="btn primary" data-a="backupFile">Save backup file</button><button class="btn ghost" data-a="restore">Restore</button></div>
    <p class="hint" style="margin:10px 0 0"><button class="link" data-a="backup">Copy backup as text instead</button></p></section>
  <section class="card"><h3>Export for Excel</h3><p class="hint" style="margin:6px 0 12px">Every set, cardio session and weigh-in as CSV.</p>
    <div class="row"><button class="btn ghost" data-a="csv">Copy CSV</button><button class="btn ghost" data-a="csvDl">Save CSV file</button></div></section>
  <button class="link" data-a="resetAll" style="color:var(--danger)">Delete all data</button>`;}

function buildCSV(){const q=v=>{v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
  const rows=[['date','type','session','exercise','set','weight_kg','reps_or_seconds','minutes','distance_km','effort','notes']];
  const dt=t=>new Date(t).toISOString().slice(0,10);
  S.sessions.forEach(s=>{if(isCardio(s.tpl)){const c=s.cardio;rows.push([dt(s.end),'cardio',tname(s.tpl),`${s.tpl==='hiit'&&c.plan!=null?HIIT[c.plan].name:c.variant} (${c.machine})${c.level?`, level ${c.level}`:''}`,'','','',c.mins,c.km??'','',c.notes]);}
    else s.entries.forEach(e=>e.sets.forEach((x,k)=>rows.push([dt(s.end),'strength',tname(s.tpl),EX[e.ex]?EX[e.ex].name:e.ex,k+1,x.w??'',x.r??'',EX[e.ex]&&EX[e.ex].type==='cardio'?x.r:'','',k===0?(e.effort||''):'',''])));});
  S.extras.forEach(x=>rows.push([dt(x.date),'extra cardio','',x.machine,'','','',x.mins,x.km??'','','']));
  S.body.forEach(b=>rows.push([dt(b.date),'bodyweight','','','',fmt1(b.kg),'','','','','']));
  return rows.map(r=>r.map(q).join(',')).join('\n');}

function copyOrShow(txt,title,okMsg,after){const show=()=>{openSheet(`<h3>${title}</h3><p class="hint">Select all and copy this text.</p><label class="field"><span>${title}</span><textarea readonly style="min-height:200px">${esc(txt)}</textarea></label><button class="btn ghost" style="width:100%" data-a="close">Done</button>`);after&&after();};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>{toast(okMsg);after&&after();},show); else show();}

/* ---------- Files ----------
   Phones: the share sheet lets you pick Save to Files, OneDrive, Mail or Notes.
   Desktop: a normal download. */
async function saveFile(txt,name,type,okMsg,after){
  const file=new File([txt],name,{type});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}); toast(okMsg); after&&after(); return;} }
  catch(e){ if(e&&e.name==='AbortError') return; }
  const url=URL.createObjectURL(file); const l=document.createElement('a'); l.href=url; l.download=name;
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); toast(okMsg); after&&after();}
document.addEventListener('change',e=>{if(e.target.id!=='rsFile'||!e.target.files[0]) return;
  e.target.files[0].text().then(t=>{$('#rs').value=t; $('[data-a="doRestore"]').click();});});

function render(){const m=$('#main');
  m.innerHTML=ui.tab==='history'?viewHistory():ui.tab==='setup'?viewSetup():(ui.summary?viewSummary():S.current?viewWorkout():viewToday());
  const sm=ui.summary&&S.sessions.find(s=>s.id===ui.summary);
  document.body.style.setProperty('--tint',`var(--${sm?sm.tpl:S.current?S.current.tpl:S.queue[0]})`);
  const vk=ui.tab+'|'+(ui.tab==='today'?(ui.summary?'sum':S.current?'wk':'next'):ui.tab==='history'?ui.hv:'');
  if(vk!==ui.viewKey){ui.viewKey=vk; m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); clearTimeout(enterT); enterT=setTimeout(()=>m.classList.remove('enter'),1100);}
  heroParallax();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  renderDock(); updateTimers(); syncWake();
  if(ui.scrollNext){ui.scrollNext=false; const el=document.querySelector('.set.current');
    if(el){const r=el.getBoundingClientRect(); if(r.top<80||r.bottom>window.innerHeight-190) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}}

function updateTimers(){const c=S.current; const now=Date.now();
  document.querySelectorAll('[data-elapsed]').forEach(el=>{if(c) el.textContent=fmtClock(now-c.start);});
  if(ui.rest){const left=ui.rest.end-now;
    if(left<=0){ui.rest=null;beep(2);renderDock();}
    else {const t=$('#dRest'),b=$('#dBar'); if(t) t.textContent=fmtClock(left+999); if(b) b.style.width=(100*left/ui.rest.total)+'%';}}
  if(c&&isCardio(c.tpl)&&ui.tab==='today'&&!ui.summary){const cd=c.cardio; const el=condElapsed(cd); const T=$('#cT'); if(!T) return;
    if(c.tpl==='hiit'){const PH=phasesFor(cd.plan),TOT=PH.total,h=HIIT[cd.plan]; let sec=el/1000;
      if(sec>=TOT&&cd.runAt){cd.acc=TOT*1000;cd.runAt=null;if(!cd.mins) cd.mins=String(Math.round(TOT/60));save();beep(3);render();toast('Session done. Add your resistance level and finish.');return;}
      sec=Math.min(sec,TOT-0.001); const i=PH.findIndex(p=>sec<p.s+p.t); const p=PH[i];
      if(cd.runAt&&ui.lastPhase!=null&&i!==ui.lastPhase) beep(p.h?2:1); ui.lastPhase=i;
      T.textContent=fmtClock((p.s+p.t-sec)*1000+999); $('#cPh').textContent=el>=TOT*1000?'Done':p.k;
      const nx=PH[i+1]; $('#cSub').textContent=p.r?`Round ${p.r} of ${h.reps}${nx?`, then ${nx.k.toLowerCase()}`:''}`:`${fmtClock(el)} elapsed`;
      $('#ctimer').classList.toggle('hard',!!p.h);
      document.querySelectorAll('#main .istrip i').forEach(x=>x.classList.toggle('on',+x.dataset.ph===i&&el>0));}
    else {const tg=(cd.target||30)*60000; T.textContent=fmtClock(el); $('#cSub').textContent=el<tg?`${fmtClock(tg-el+999)} to ${cd.target||30} min`:'Target reached. Stop whenever you\u2019re ready.';}}}
setInterval(updateTimers,500);

/* ---------- Motion-capture figure: the next lift, drawn as a mocap rig ---------- */
/* ---------- Exercise demos: IK mannequin ----------
   Each exercise gives key poses: hip position (h), torso angle (t), head angle (n),
   hand targets (w, w2) and foot targets (a, a2). A two-bone solver places elbows and
   knees, so limbs keep their length through the whole rep. Angles: 0 = right, 90 = down. */
const LEN={T:56,ua:27,fa:25,th:41,sh:39,ft:13};
const dir=a=>{const r=a*Math.PI/180;return [Math.cos(r),Math.sin(r)];};
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]], mul=(v,k)=>[v[0]*k,v[1]*k];
function ik(R,T,a,b,s){const dx=T[0]-R[0],dy=T[1]-R[1]; let d=Math.hypot(dx,dy); d=Math.min(Math.max(d,Math.abs(a-b)+0.5),a+b-0.05);
  const th=Math.atan2(dy,dx)*180/Math.PI, al=Math.acos(Math.min(1,Math.max(-1,(a*a+d*d-b*b)/(2*a*d))))*180/Math.PI;
  return [add(R,mul(dir(th+s*al),a)),add(R,mul(dir(th),d))];}
function normPose(k,sp){const f=sp.front, cx=k.h[0], mir=p=>[2*cx-p[0],p[1]], off=p=>[p[0]-4,p[1]-2];
  const o={h:k.h,t:k.t??-90,n:k.n??k.t??-90,sy:k.sy||0,w:k.w,a:k.a,ft:k.ft??0,eb:k.eb??1,kb:k.kb??-1};
  o.w2=k.w2||(f?mir(k.w):off(k.w)); o.a2=k.a2||(f?mir(k.a):off(k.a));
  o.ft2=k.ft2??(f?180-o.ft:o.ft); o.eb2=k.eb2??(f?-o.eb:o.eb); o.kb2=k.kb2??(f?-o.kb:o.kb); return o;}
function lerpPose(p,q,u){const L=(x,y)=>x+(y-x)*u, LA=(x,y)=>[L(x[0],y[0]),L(x[1],y[1])];
  return {h:LA(p.h,q.h),t:L(p.t,q.t),n:L(p.n,q.n),sy:L(p.sy,q.sy),w:LA(p.w,q.w),w2:LA(p.w2,q.w2),a:LA(p.a,q.a),a2:LA(p.a2,q.a2),
    ft:L(p.ft,q.ft),ft2:L(p.ft2,q.ft2),eb:p.eb,eb2:p.eb2,kb:p.kb,kb2:p.kb2};}
function solvePose(k,sp){const J={}, f=sp.front;
  const S=add(add(k.h,mul(dir(k.t),LEN.T)),[0,-k.sy]); J.N=add(S,mul(dir(k.t),6)); J.Hd=add(J.N,mul(dir(k.n),12)); J.H=k.h;
  J.S=f?add(S,[f.sw,0]):S; J.S2=f?add(S,[-f.sw,0]):add(S,[-4,-2]);
  J.Hp=f?add(k.h,[f.hw,0]):k.h; J.Hp2=f?add(k.h,[-f.hw,0]):add(k.h,[-4,-2]);
  [J.E,J.W]=ik(J.S,k.w,LEN.ua,LEN.fa,k.eb); [J.E2,J.W2]=ik(J.S2,k.w2,LEN.ua,LEN.fa,k.eb2);
  [J.K,J.A]=ik(J.Hp,k.a,LEN.th,LEN.sh,k.kb); [J.K2,J.A2]=ik(J.Hp2,k.a2,LEN.th,LEN.sh,k.kb2);
  J.T=add(J.A,mul(dir(k.ft),LEN.ft)); J.T2=add(J.A2,mul(dir(k.ft2),LEN.ft)); return J;}
function timeline(sp){const K=sp.keys.map(k=>normPose(k,sp)), n=K.length;
  const hold=i=>Array.isArray(sp.hold)?sp.hold[i]:(sp.hold??0.25), steps=sp.steps||10, ease=sp.ease!==false;
  const W=n+K.reduce((a,_,i)=>a+hold(i),0); const fr=[]; let t=0;
  for(let i=0;i<n;i++){fr.push([t,K[i]]); if(hold(i)>0){t+=hold(i); fr.push([t,K[i]]);}
    for(let s=1;s<=steps;s++){let u=s/steps; if(ease) u=(1-Math.cos(Math.PI*u))/2; fr.push([t+s/steps,lerpPose(K[i],K[(i+1)%n],u)]);}
    t+=1;}
  return {times:fr.map(x=>x[0]/W),poses:fr.map(x=>solvePose(x[1],sp)),keys:K.map(k=>solvePose(k,sp))};}

function figure(sp){if(!sp) return ''; const still=calm.matches, dur=sp.dur||3.8;
  const tl=timeline(sp), F=tl.poses, kt=tl.times.map(x=>x.toFixed(4)).join(';');
  const v=(k,i)=>F.map(p=>p[k][i].toFixed(1)), same=a=>a.every(x=>x===a[0]);
  const an=(at,vals)=>still||same(vals)?'':`<animate attributeName="${at}" values="${vals.join(';')}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite"/>`;
  const seg=(p,q,w,c='')=>`<line class="${c}" stroke-width="${w}" x1="${F[0][p][0].toFixed(1)}" y1="${F[0][p][1].toFixed(1)}" x2="${F[0][q][0].toFixed(1)}" y2="${F[0][q][1].toFixed(1)}">${an('x1',v(p,0))}${an('y1',v(p,1))}${an('x2',v(q,0))}${an('y2',v(q,1))}</line>`;
  const at=(k,inner,c='')=>{const xs=v(k,0),ys=v(k,1),tv=F.map((_,i)=>xs[i]+' '+ys[i]);
    return `<g class="${c}" transform="translate(${tv[0]})">${still||same(tv)?'':`<animateTransform attributeName="transform" type="translate" values="${tv.join(';')}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite"/>`}${inner}</g>`;};
  const DB=sp.db==='goblet'?'<rect class="plt" x="-6" y="-17" width="12" height="7" rx="2"/><rect class="plt" x="-6" y="10" width="12" height="7" rx="2"/><line class="hdl" x1="0" y1="-10" x2="0" y2="10"/>'
                          :'<circle class="plt" r="7.5"/><circle class="hub" r="2.4"/>';
  const dbAt=sp.dbAt||'W', fr=sp.front?'':'far';
  const limbs=(s,c)=>seg('Hp'+s,'K'+s,10,c)+seg('K'+s,'A'+s,8,c)+seg('A'+s,'T'+s,5,c)+seg('S'+s,'E'+s,7,c)+seg('E'+s,'W'+s,6,c)+at('W'+s,'<circle r="3.6"/>',c+' hand');
  let g=`<ellipse class="shadow" cx="${F[0].A[0].toFixed(0)}" cy="189" rx="30" ry="3"/>`;
  if(sp.db&&!sp.front) g+=`<polyline class="path" points="${tl.keys.map(J=>J[dbAt].map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`;
  g+=limbs('2',fr); if(sp.db==='pair') g+=at(dbAt+'2',DB,'db '+fr);
  g+=seg('N','H',sp.front?24:17,'torso')+seg('N','Hd',5)+at('Hd','<ellipse rx="9" ry="10"/>','head')+limbs('','');
  if(sp.db) g+=at(dbAt,DB,'db');
  g+=['E','W','K','A','H','S'].map(k=>at(k,'<circle r="1.6"/>','jt')).join('');
  let ticks=''; for(let x=20;x<=180;x+=10) ticks+=`<line class="tick" x1="${x}" y1="188" x2="${x}" y2="${x%50===0?194:191}"/>`;
  const pr=(sp.prop||'').split(' ').filter(Boolean).map(p=>PROPS[p]).join('');
  return `<svg viewBox="-15 -30 230 230" aria-hidden="true"><line class="floor" x1="0" y1="188" x2="200" y2="188"/>${ticks}<g class="prop">${pr}</g><g class="rig">${g}</g></svg>`;}
